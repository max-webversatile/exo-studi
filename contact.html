<!-- element contact --> 

<main> 
    <section>
        <h2>Contactez-nous</h2>
        <p>Pour toute question ou demande, n'hésitez pas à nous contacter.</p>
        <ul>
            <li>Téléphone : 01 23 45 67 89</li>
            <li>Email : contact@maboulangerie.com</li>
        </ul>
    </section>
</main>
<fieldset>
    <p>
        <label for="nom">Nom *</label>
        <input type="text" id="nom" name="nom" autocomplete="name" placeholder="nom prenom" required>
    </p>
    <p>
        <label for="email">E-mail *</label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="exemple@gmail.com" required>
    </p>
    <p> 
        <label for="tel">Téléphone</label>
        <input type="tel" id="tel" name="tel" autocomplete="tel" placeholder="*optionnel*"
        pattern="0[1-9]([ .]?[0-9]{2}){4}" title="Format : 06 12 34 56 78">
    </p>
    <p>
        <label for="date">Date du jour *</label>
        <input type="date" id="date" name="date" required>
    </p>
        <legend>Contact</legend>
        <p>
            <label for="produit">Sujet *</label>
                <select id="produit" name="produit" required>
                <option value="">Choisir</option>
                <option value="question">Question</option>
                <option value="aide">Aide</option>
                <option label="Autre" value="autre">
                <option value="demande particuliere">Demande particulière</option>
            </select>
        </p>
        <p>
            <label for="msg">Message</label>
            <textarea id="msg" name="msg" rows="3" maxlength="400" placeholder="Informations supplémentaires..." ></textarea>
        </p>
        <p>
            <input type="checkbox" id="cgv" name="cgv" required>
            <label for="cgv">J'accepte les conditions *</label>
        </p>
        <button type="submit">Envoyer la demande</button>
    <p>
</fieldset>
